<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterpoint</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="source">
      <span class="host" id="host">Counterpoint</span>
      <span class="page-title" id="pageTitle"></span>
    </div>
    <button id="gear" class="icon-btn" aria-label="Model settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
    </button>
  </header>

  <section id="settings" class="settings" hidden>
    <h2 class="settings-title">Which model answers</h2>
    <div id="providers" class="providers" role="radiogroup" aria-label="Model"></div>
    <label id="keyRow" class="field">API key
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key">
    </label>
    <label id="modelRow" class="field">Model name
      <input id="model" type="text" spellcheck="false">
    </label>
    <p class="fine">Your key stays in this browser and only goes to the provider you pick. They bill you directly.</p>
    <div class="row">
      <button id="save" class="primary">Save</button>
      <button id="cancel">Cancel</button>
    </div>
  </section>

  <main id="out" aria-live="polite"></main>

  <footer id="foot" class="foot" hidden>
    <button id="again">Run again</button>
    <span id="via" class="via"></span>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
