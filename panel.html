<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterpoint</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="source">
      <span class="host" id="host">Counterpoint</span>
      <span class="page-title" id="pageTitle"></span>
    </div>
    <button id="gear" class="icon-btn" aria-label="Model settings" title="Model settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </header>

  <section id="settings" class="settings" hidden>
    <h2 class="settings-title">Model</h2>
    <div id="providers" class="providers" role="radiogroup" aria-label="Model"></div>
    <label id="keyRow" class="field"><span>API key</span>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key">
    </label>
    <label id="modelRow" class="field"><span>Model name</span>
      <input id="model" type="text" spellcheck="false">
    </label>
    <label class="switch-row"><input id="auto" type="checkbox"><span><b>Run on its own when I switch pages</b><small>Pages you've already countered always show their saved answer.</small></span></label>
    <p class="fine">Your key stays in this browser and only goes to the provider you pick. They bill you directly.</p>
    <div class="row">
      <button id="cancel" class="text-btn">Cancel</button>
      <button id="save" class="filled-btn">Save</button>
    </div>
  </section>

  <main id="out" aria-live="polite">
    <div class="state checking"><div class="progress unknown"><span></span></div><p>Getting ready…</p></div>
  </main>

  <footer id="composer" class="composer" hidden>
    <form id="ask" class="ask">
      <input id="question" type="text" autocomplete="off" placeholder="Ask a follow-up" aria-label="Ask a follow-up">
      <button id="send" class="send" aria-label="Send" title="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
    <p id="via" class="via"></p>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
