<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Counterpoint promo tile</title>
<style>
  /* 440x280 Chrome Web Store small promo tile */
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: #0b57d0; color: #fff;
    font-family: "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; align-content: center; padding: 0 40px; box-sizing: border-box;
  }
  svg { width: 120px; height: 48px; fill: none; stroke-linecap: round; margin-bottom: 22px; overflow: visible; }
  .p { stroke: #a8c7fa; stroke-width: 5; }
  .c { stroke: #fff; stroke-width: 6; }
  h1 { margin: 0; font-size: 44px; font-weight: 500; letter-spacing: -0.015em; }
  p { margin: 6px 0 0; font-size: 20px; color: #d3e3fd; }
</style></head>
<body>
  <svg viewBox="0 0 40 16"><path class="p" d="M2 14 C 14 14, 26 2, 38 2"/><path class="c" d="M2 2 C 14 2, 26 14, 38 14"/></svg>
  <h1>Counterpoint</h1>
  <p>See the other side of any page</p>
</body></html>
